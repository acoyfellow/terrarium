name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  effect:
    name: Effect typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: effect/package-lock.json
      - name: Install effect package
        run: npm --prefix effect ci
      - name: Typecheck
        run: npm --prefix effect run typecheck
      - name: Tests
        run: npm --prefix effect test
