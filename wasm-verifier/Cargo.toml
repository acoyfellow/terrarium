[package]
name = "terrarium-receipt-verifier"
version = "0.0.1"
edition = "2021"
description = "Portable WASM verifier for Terrarium content-addressed receipt artifacts. Recomputes the SHA-256 content hash of a canonical receipt body with zero host trust and no dependencies."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
