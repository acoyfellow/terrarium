<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Three seed pods, one gardener</title><desc id="desc">One gardener robot plants three sealed pods at once; each grows independently while the parent waits for a quorum.</desc>
<defs><radialGradient id="bg" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#244832"/><stop offset=".58" stop-color="#0b1710"/><stop offset="1" stop-color="#030604"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><ellipse cx="800" cy="790" rx="690" ry="70" fill="#020503" opacity=".7"/>
<path d="M385 145 C385 82 1215 82 1215 145 L1320 735 C1320 812 280 812 280 735 Z" fill="#8ff0ad10" stroke="#8ff0ad66" stroke-width="3"/>
<text x="800" y="112" text-anchor="middle" fill="#eef8f0" font-family="Manrope, system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">Three pods. One explicit batch.</text>
<text x="800" y="160" text-anchor="middle" fill="#9cb1a1" font-family="Manrope, system-ui, sans-serif" font-size="24">The parent plants independent runs, then waits for the chosen join condition.</text>
<g transform="translate(700 250)"><rect width="200" height="92" rx="28" fill="#f5fff7"/><rect x="55" y="-50" width="90" height="78" rx="24" fill="#f5fff7"/><rect x="72" y="-30" width="56" height="30" rx="12" fill="#07100c"/><circle cx="88" cy="-15" r="5" fill="#8ff0ad"/><circle cx="112" cy="-15" r="5" fill="#8ff0ad"/><text x="100" y="58" text-anchor="middle" fill="#07100c" font-family="ui-monospace,monospace" font-size="19">PARENT</text></g>
<g fill="none" stroke="#8ff0ad" stroke-width="5" stroke-dasharray="14 18" opacity=".8"><path d="M735 350 C610 410 520 455 455 540"/><path d="M800 350 V525"/><path d="M865 350 C990 410 1080 455 1145 540"/></g>
<g font-family="ui-monospace,monospace" text-anchor="middle">
<g transform="translate(335 530)"><ellipse cx="120" cy="120" rx="95" ry="42" fill="#07100c"/><path d="M55 120 C55 45 185 45 185 120 Z" fill="#102318" stroke="#8ff0ad" stroke-width="3"/><path d="M120 98 C120 58 150 45 168 35" stroke="#8ff0ad" stroke-width="7" fill="none" filter="url(#glow)"/><text x="120" y="168" fill="#a8dbb5" font-size="18">run A</text></g>
<g transform="translate(680 530)"><ellipse cx="120" cy="120" rx="95" ry="42" fill="#07100c"/><path d="M55 120 C55 45 185 45 185 120 Z" fill="#102318" stroke="#8ff0ad" stroke-width="3"/><path d="M120 98 C120 50 105 35 82 24" stroke="#8ff0ad" stroke-width="7" fill="none" filter="url(#glow)"/><text x="120" y="168" fill="#a8dbb5" font-size="18">run B</text></g>
<g transform="translate(1025 530)"><ellipse cx="120" cy="120" rx="95" ry="42" fill="#07100c"/><path d="M55 120 C55 45 185 45 185 120 Z" fill="#102318" stroke="#8ff0ad" stroke-width="3"/><path d="M120 98 C120 65 135 50 152 42" stroke="#789181" stroke-width="7" fill="none"/><text x="120" y="168" fill="#789181" font-size="18">run C</text></g>
</g>
<g transform="translate(590 735)"><rect width="420" height="58" rx="29" fill="#0d1912" stroke="#8ff0ad"/><text x="210" y="37" text-anchor="middle" fill="#8ff0ad" font-family="ui-monospace,monospace" font-size="18" letter-spacing="2">quorum reached: 2 of 3</text></g>
</svg>
