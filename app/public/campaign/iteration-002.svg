<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The blank receipt keeps the gate shut</title><desc id="desc">A tiny robot celebrates exit zero while an outside verifier refuses to open the jar because the task receipt is blank.</desc>
<defs><radialGradient id="bg" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#3d3522"/><stop offset=".56" stop-color="#11130b"/><stop offset="1" stop-color="#050403"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><ellipse cx="800" cy="790" rx="670" ry="72" fill="#020503" opacity=".72"/>
<path d="M390 145 C390 82 1210 82 1210 145 L1315 735 C1315 810 285 810 285 735 Z" fill="#ffd36b0c" stroke="#d6b35d66" stroke-width="3"/>
<text x="800" y="112" text-anchor="middle" fill="#fff4d7" font-family="Manrope, system-ui, sans-serif" font-size="56" font-weight="800" letter-spacing="-2">The bell is not the receipt.</text>
<text x="800" y="160" text-anchor="middle" fill="#c9b98b" font-family="Manrope, system-ui, sans-serif" font-size="24">Exit 0 can ring loudly. Terrarium still waits for correlated proof of the task.</text>
<g transform="translate(430 430)"><rect x="0" y="88" width="210" height="92" rx="28" fill="#f5fff7"/><rect x="54" y="30" width="102" height="82" rx="25" fill="#f5fff7"/><rect x="75" y="52" width="60" height="32" rx="12" fill="#07100c"/><circle cx="91" cy="68" r="5" fill="#ffd36b"/><circle cx="119" cy="68" r="5" fill="#ffd36b"/><path d="M-35 35 C10 0 60 0 105 35" fill="none" stroke="#ffd36b" stroke-width="6" stroke-dasharray="10 13" filter="url(#glow)"/><text x="105" y="225" text-anchor="middle" fill="#ffd36b" font-family="ui-monospace,monospace" font-size="20">exit: 0</text></g>
<g transform="translate(840 360)"><rect width="300" height="250" rx="20" fill="#160d0c" stroke="#ff746c" stroke-width="3"/><text x="150" y="55" text-anchor="middle" fill="#ff958d" font-family="ui-monospace,monospace" font-size="24" letter-spacing="3">TASK RECEIPT</text><path d="M75 110 H225 M75 150 H180" stroke="#6e4743" stroke-width="12" stroke-linecap="round"/><path d="M212 110 l52 52 M264 110 l-52 52" stroke="#ff746c" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/><text x="150" y="215" text-anchor="middle" fill="#d8aaa6" font-family="ui-monospace,monospace" font-size="18">missing</text></g>
<g transform="translate(1120 560)"><rect width="150" height="90" rx="18" fill="#0d1912" stroke="#8ff0ad"/><text x="75" y="55" text-anchor="middle" fill="#8ff0ad" font-family="ui-monospace,monospace" font-size="18">GATE SHUT</text></g>
<text x="800" y="735" text-anchor="middle" fill="#c8ab72" font-family="ui-monospace,monospace" font-size="19">receipt note: status becomes inconclusive, not successful</text>
</svg>
