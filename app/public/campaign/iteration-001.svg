<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The tagged firefly returns</title><desc id="desc">A cinematic terrarium scene where only the callback firefly with the matching run tag returns to the robot desk that spawned it.</desc>
<defs><radialGradient id="bg" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#31583d"/><stop offset=".55" stop-color="#0b1710"/><stop offset="1" stop-color="#030604"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/><ellipse cx="800" cy="795" rx="690" ry="70" fill="#020503" opacity=".7"/>
<path d="M385 142 C385 78 1215 78 1215 142 L1320 735 C1320 812 280 812 280 735 Z" fill="#8ff0ad10" stroke="#8ff0ad66" stroke-width="3"/>
<path d="M510 185 C610 125 990 125 1090 185" fill="none" stroke="#eef8f0" stroke-opacity=".22" stroke-width="10" stroke-linecap="round"/>
<text x="800" y="112" text-anchor="middle" fill="#eef8f0" font-family="Manrope, system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">The tagged firefly returns.</text>
<text x="800" y="160" text-anchor="middle" fill="#9cb1a1" font-family="Manrope, system-ui, sans-serif" font-size="24">A callback wakes the session that spawned the run, not every desk in the lab.</text>
<g transform="translate(290 510)"><rect width="220" height="95" rx="22" fill="#0d1912" stroke="#31543a"/><circle cx="110" cy="-8" r="28" fill="#f5fff7"/><rect x="87" y="-19" width="46" height="23" rx="10" fill="#07100c"/><circle cx="99" cy="-8" r="4" fill="#8ff0ad"/><circle cx="121" cy="-8" r="4" fill="#8ff0ad"/><text x="110" y="58" text-anchor="middle" fill="#789181" font-family="ui-monospace,monospace" font-size="18">SIBLING DESK</text></g>
<g transform="translate(690 500)"><rect width="220" height="110" rx="24" fill="#102318" stroke="#8ff0ad" stroke-width="3" filter="url(#glow)"/><circle cx="110" cy="-16" r="34" fill="#f5fff7"/><rect x="82" y="-31" width="56" height="30" rx="12" fill="#07100c"/><circle cx="98" cy="-16" r="5" fill="#8ff0ad"/><circle cx="122" cy="-16" r="5" fill="#8ff0ad"/><text x="110" y="62" text-anchor="middle" fill="#8ff0ad" font-family="ui-monospace,monospace" font-size="18">MATCHING RUN ID</text></g>
<g transform="translate(1090 510)"><rect width="220" height="95" rx="22" fill="#0d1912" stroke="#31543a"/><circle cx="110" cy="-8" r="28" fill="#f5fff7"/><rect x="87" y="-19" width="46" height="23" rx="10" fill="#07100c"/><circle cx="99" cy="-8" r="4" fill="#8ff0ad"/><circle cx="121" cy="-8" r="4" fill="#8ff0ad"/><text x="110" y="58" text-anchor="middle" fill="#789181" font-family="ui-monospace,monospace" font-size="18">SIBLING DESK</text></g>
<g filter="url(#glow)"><circle cx="800" cy="350" r="13" fill="#8ff0ad"/><path d="M800 365 C760 420 740 455 800 500" fill="none" stroke="#8ff0ad" stroke-width="5" stroke-dasharray="12 16"/><circle cx="540" cy="370" r="8" fill="#31543a"/><circle cx="1060" cy="370" r="8" fill="#31543a"/></g>
<text x="800" y="735" text-anchor="middle" fill="#a8dbb5" font-family="ui-monospace,monospace" font-size="19">receipt note: callback event is keyed by concrete runId</text>
