<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Exit zero is not task success</title>
  <desc id="desc">Editorial diagram showing a process exit separate from a verified Terrarium result receipt.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#28422f"/>
      <stop offset="0.55" stop-color="#0b1710"/>
      <stop offset="1" stop-color="#040806"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="780" rx="650" ry="72" fill="#020503" opacity="0.7"/>
  <path d="M410 145 C410 82 1190 82 1190 145 L1305 735 C1305 805 295 805 295 735 Z" fill="#8ff0ad10" stroke="#8ff0ad66" stroke-width="3"/>
  <path d="M505 185 C580 138 1020 138 1095 185" fill="none" stroke="#eef8f0" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(360 345)">
    <rect width="350" height="250" rx="28" fill="#0d1912" stroke="#426b4d" stroke-width="3"/>
    <text x="175" y="62" text-anchor="middle" fill="#8ff0ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="3">PROCESS</text>
    <circle cx="175" cy="135" r="52" fill="#102318" stroke="#8ff0ad" stroke-width="4" filter="url(#glow)"/>
    <text x="175" y="146" text-anchor="middle" fill="#e8f3eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42">0</text>
    <text x="175" y="215" text-anchor="middle" fill="#8ea391" font-family="Manrope, system-ui, sans-serif" font-size="24">it exited cleanly</text>
  </g>
  <g transform="translate(890 345)">
    <rect width="350" height="250" rx="28" fill="#1a0e0d" stroke="#ff746c" stroke-width="3"/>
    <text x="175" y="62" text-anchor="middle" fill="#ff958d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="3">RECEIPT</text>
    <path d="M120 120 h110 M120 158 h88" stroke="#f4c5c1" stroke-width="12" stroke-linecap="round"/>
    <path d="M245 112 l42 42 M287 112 l-42 42" stroke="#ff746c" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
    <text x="175" y="215" text-anchor="middle" fill="#d8aaa6" font-family="Manrope, system-ui, sans-serif" font-size="24">no verified result</text>
  </g>
  <path d="M720 470 C780 430 820 430 880 470" fill="none" stroke="#789181" stroke-width="6" stroke-dasharray="16 18"/>
  <text x="800" y="438" text-anchor="middle" fill="#789181" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">not enough</text>
  <text x="800" y="120" text-anchor="middle" fill="#e8f3eb" font-family="Manrope, system-ui, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Exit 0 is not task success.</text>
  <text x="800" y="172" text-anchor="middle" fill="#9cb1a1" font-family="Manrope, system-ui, sans-serif" font-size="25">Terrarium waits for a correlated receipt before it accepts child work as done.</text>
  <g transform="translate(650 650)">
    <rect width="300" height="58" rx="29" fill="#07100c" stroke="#31543a"/>
    <text x="150" y="38" text-anchor="middle" fill="#a8dbb5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">status: inconclusive</text>
  </g>
</svg>
